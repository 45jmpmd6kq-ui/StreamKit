<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>StreamKit — carte de fin de match Clubs</title>
    <style>
      /* Fond transparent obligatoire : OBS incruste la page telle quelle. La
         source fait 488 x 720 : l'element a 24 px du haut et de la gauche. Elle
         est prevue pour 11 joueurs humains ; au-dela de 8, les lignes se
         resserrent. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      :root {
        --fond: rgba(8, 13, 22, 0.93);
        --texte: #f2f4f7;
        --attenue: rgba(242, 244, 247, 0.62);
        --pale: rgba(242, 244, 247, 0.3);
        --filet: rgba(242, 244, 247, 0.07);
        --victoire: #3ddc84;
        --nul: #a3acbd;
        --defaite: #ff4d5e;
        --ambre: #f2c14e;
        --or: #ffd24a;
        --club: #3b7bff;
        --club-voile: rgba(59, 123, 255, 0.16);
        --typo: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      }

      body {
        font-family: var(--typo);
        color: var(--texte);
        font-variant-numeric: tabular-nums;
      }

      #cadre {
        position: absolute;
        top: 24px;
        left: 24px;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
      }
      #cadre.visible { opacity: 1; transform: none; }

      #carte {
        width: 440px;
        box-sizing: border-box;
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--fond);
        border-top: 3px solid var(--club);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
      }

      .etiquette {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1;
        color: var(--attenue);
        white-space: nowrap;
      }

      .entete { display: flex; align-items: center; gap: 10px; }
      #resultat {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1;
        padding: 5px 8px;
        white-space: nowrap;
      }
      #resultat.V { color: #062814; background: var(--victoire); }
      #resultat.N { color: #10141c; background: var(--nul); }
      #resultat.D { color: #2a0509; background: var(--defaite); }
      #sr {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      #sr[hidden] { display: none; }
      #sr .etiquette { font-size: 12px; letter-spacing: 0; }
      #sr.hausse { color: var(--victoire); }
      #sr.baisse { color: var(--defaite); }
      #sr svg { width: 10px; height: 10px; }
      #sr.hausse svg { fill: var(--victoire); }
      #sr.baisse svg { fill: var(--defaite); transform: rotate(180deg); }

      .score {
        height: 58px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 12px;
        background: var(--club-voile);
      }
      .blason { width: 30px; height: 35px; flex-shrink: 0; }
      .blason .fond-blason { fill: var(--club); }
      .blason .initiales { font: 700 11px var(--typo); letter-spacing: 0.04em; fill: #fff; }
      .qui { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
      #nom {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #adversaire { font-size: 12px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--attenue); }
      #adversaire[hidden] { display: none; }
      .chiffres { margin-left: auto; display: flex; align-items: baseline; gap: 8px; font-size: 34px; font-weight: 700; line-height: 1; flex-shrink: 0; }
      .chiffres .tiret { font-size: 20px; color: rgba(242, 244, 247, 0.4); }
      #encaisses { color: rgba(242, 244, 247, 0.7); }

      .colonnes, .ligne { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
      .c-poste { width: 40px; flex-shrink: 0; text-align: center; }
      .c-nom { flex-grow: 1; min-width: 0; }
      .c-buts, .c-pd { width: 34px; flex-shrink: 0; text-align: center; }
      .c-note { width: 46px; flex-shrink: 0; text-align: center; }

      #joueurs { display: flex; flex-direction: column; gap: 2px; }
      .ligne { height: 44px; box-sizing: border-box; border-bottom: 1px solid var(--filet); }
      .ligne:last-child { border-bottom: 0; }
      .poste {
        box-sizing: border-box;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
        padding: 4px 0;
        color: rgba(242, 244, 247, 0.85);
        border: 1px solid rgba(242, 244, 247, 0.25);
      }
      .c-nom { display: flex; flex-direction: column; gap: 5px; }
      .nom-ligne { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .nom-joueur { font-size: 16px; font-weight: 600; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .etoile { width: 13px; height: 13px; flex-shrink: 0; fill: var(--or); }
      .rouge { width: 8px; height: 11px; flex-shrink: 0; background: var(--defaite); }
      .detail { font-size: 11px; line-height: 1; white-space: nowrap; color: var(--attenue); }
      .nombre { font-size: 16px; font-weight: 700; line-height: 1; }
      .nombre.zero { color: var(--pale); }
      .note { box-sizing: border-box; font-size: 15px; font-weight: 700; line-height: 1; padding: 5px 0; }
      .note.vert { color: #062814; background: var(--victoire); }
      .note.neutre { color: var(--texte); background: rgba(242, 244, 247, 0.12); }
      .note.ambre { color: #2a1e04; background: var(--ambre); }
      .note.rouge { color: #2a0509; background: var(--defaite); }

      /* Plus de 8 joueurs : lignes resserrees, sans la ligne de detail. */
      #carte.compact .ligne { height: 32px; }
      #carte.compact .detail { display: none; }

      #sans-joueur { font-size: 11px; line-height: 1; color: var(--attenue); padding: 0 4px; }
      #sans-joueur[hidden] { display: none; }

      #stat { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; background: rgba(242, 244, 247, 0.05); }
      #stat[hidden] { display: none; }
      .stat-haut { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      #stat-valeur { font-size: 12px; font-weight: 700; line-height: 1; }
      #stat-texte { font-size: 15px; font-weight: 600; line-height: 1.15; }
      .barre { height: 5px; background: rgba(242, 244, 247, 0.12); }
      .barre[hidden] { display: none; }
      #stat-barre { height: 5px; width: 0; background: var(--club); }
    </style>
  </head>
  <body>
    <div id="cadre">
      <div id="carte">
        <div class="entete">
          <span id="resultat"></span>
          <span class="etiquette" id="contexte"></span>
          <span id="sr" hidden>
            <span class="etiquette">SR</span>
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5L9 8.5H1z" /></svg>
            <span id="sr-texte"></span>
          </span>
        </div>
        <div class="score">
          <svg class="blason" viewBox="0 0 38 44" aria-hidden="true">
            <path class="fond-blason" d="M19 1L36 6V20C36 31 28 38 19 43C10 38 2 31 2 20V6Z" />
            <path d="M19 5.5L32 9.3V20C32 28.6 26 34.3 19 38.3C12 34.3 6 28.6 6 20V9.3Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.5" />
            <text class="initiales" id="initiales" x="19" y="25.5" text-anchor="middle"></text>
          </svg>
          <div class="qui">
            <span id="nom"></span>
            <span id="adversaire" hidden></span>
          </div>
          <div class="chiffres">
            <span id="buts"></span><span class="tiret">–</span><span id="encaisses"></span>
          </div>
        </div>
        <div class="colonnes">
          <span class="etiquette c-poste">Poste</span>
          <span class="etiquette c-nom">Joueur</span>
          <span class="etiquette c-buts">Buts</span>
          <span class="etiquette c-pd">PD</span>
          <span class="etiquette c-note">Note</span>
        </div>
        <div id="joueurs"></div>
        <div id="sans-joueur" hidden></div>
        <div id="stat" hidden>
          <div class="stat-haut">
            <span class="etiquette">Stat du match</span>
            <span id="stat-valeur"></span>
          </div>
          <span id="stat-texte"></span>
          <div class="barre" id="stat-fond"><div id="stat-barre"></div></div>
        </div>
      </div>
    </div>

    <script src="/commun/flux.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const cadre = $("cadre");
      const BASE = location.pathname.replace(/\/$/, "");

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function rvba(hex, a) {
        const n = parseInt(String(hex || "").replace("#", "").slice(0, 6), 16) || 0x3b7bff;
        return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + a + ")";
      }

      const ETOILE =
        '<svg class="etoile" viewBox="0 0 24 24" aria-label="Homme du match"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" /></svg>';

      // Un nom trop long pour sa place retrecit (jusqu'a `min` px) plutot que
      // d'etre coupe : EA accepte des noms de club de plus de 20 caracteres.
      function ajuster(el, max, min) {
        el.style.fontSize = max + "px";
        for (let t = max; t > min && el.scrollWidth > el.clientWidth; t--) el.style.fontSize = t - 1 + "px";
      }

      const nombre = (n) => '<span class="nombre' + (n ? "" : " zero") + '">' + (n ? n : "–") + "</span>";

      function ligne(j) {
        return (
          '<div class="ligne">' +
          '<span class="c-poste poste">' + esc(j.poste) + "</span>" +
          '<div class="c-nom">' +
          '<div class="nom-ligne"><span class="nom-joueur">' + esc(j.nom) + "</span>" +
          (j.hdm ? ETOILE : "") +
          (j.rouge ? '<span class="rouge" aria-label="Carton rouge"></span>' : "") +
          "</div>" +
          '<span class="detail">' + esc(j.detail) + "</span>" +
          "</div>" +
          '<span class="c-buts">' + nombre(j.buts) + "</span>" +
          '<span class="c-pd">' + nombre(j.pd) + "</span>" +
          '<span class="c-note note ' + esc(j.ton) + '">' + esc(j.note) + "</span>" +
          "</div>"
        );
      }

      let signature = "";

      function appliquer(etat) {
        const m = etat?.match;
        if (!etat || !m) {
          cadre.classList.remove("visible");
          return;
        }
        // Les listes ne se reconstruisent que si le match a change, pas a chaque
        // etat recu (l'apparition et la disparition n'en changent que `visible`).
        const texte = JSON.stringify([etat.club, m]);
        if (texte !== signature) {
          signature = texte;
          rendre(etat.club || {}, m);
        }
        cadre.classList.toggle("visible", !!etat.visible);
      }

      function rendre(club, m) {
        const racine = document.documentElement.style;
        racine.setProperty("--club", club.couleur || "#3b7bff");
        racine.setProperty("--club-voile", rvba(club.couleur, 0.16));
        $("initiales").textContent = club.initiales || "";
        $("nom").textContent = club.nom || "";

        $("resultat").textContent = m.libelle || "";
        $("resultat").className = m.resultat || "";
        $("contexte").textContent = m.contexte || "";
        $("sr").hidden = !m.sr;
        if (m.sr) {
          $("sr").className = m.sr.signe < 0 ? "baisse" : "hausse";
          $("sr-texte").textContent = String(m.sr.texte).replace(/^[+−]/, "");
        }

        $("adversaire").hidden = !m.adversaire;
        $("adversaire").textContent = m.adversaire ? "contre " + m.adversaire : "";
        $("buts").textContent = m.buts;
        $("encaisses").textContent = m.encaisses;
        ajuster($("nom"), 18, 12);

        $("carte").classList.toggle("compact", !!m.compact);
        $("joueurs").innerHTML = (m.joueurs || []).map(ligne).join("");

        const sans = m.butsSansJoueur || 0;
        $("sans-joueur").hidden = !sans;
        $("sans-joueur").textContent = sans
          ? "+ " + sans + (sans > 1 ? " buts sans buteur connu" : " but sans buteur connu") + " (coéquipier IA ou contre son camp)"
          : "";

        const s = m.stat;
        $("stat").hidden = !s;
        if (s) {
          $("stat-texte").textContent = s.texte || "";
          $("stat-valeur").textContent = s.valeur || "";
          $("stat-fond").hidden = s.ratio == null;
          $("stat-barre").style.width = Math.round((s.ratio || 0) * 100) + "%";
        }
      }

      // ?demo=1 : la carte d'exemple reste affichee, le temps de placer la source.
      const DEMO = {
        visible: true,
        club: { nom: "FC Les Potes", initiales: "FLP", couleur: "#3b7bff", division: "Div. 3" },
        match: {
          resultat: "V",
          libelle: "Victoire",
          contexte: "Championnat · Div. 3",
          sr: { texte: "+12", signe: 1 },
          buts: 4,
          encaisses: 2,
          adversaire: "Inter Pantoufle",
          compact: false,
          joueurs: [
            { poste: "ATT", nom: "Tomzer", detail: "5 tirs", buts: 2, pd: 1, note: "8,9", ton: "vert", hdm: true, rouge: false },
            { poste: "ATT", nom: "Yass", detail: "3 tirs", buts: 1, pd: 1, note: "8,1", ton: "vert", hdm: false, rouge: false },
            { poste: "MIL", nom: "Kev", detail: "31/35 passes", buts: 0, pd: 2, note: "7,6", ton: "neutre", hdm: false, rouge: false },
            { poste: "DEF", nom: "Juju", detail: "6/8 tacles", buts: 0, pd: 0, note: "7,2", ton: "neutre", hdm: false, rouge: false },
            { poste: "MIL", nom: "Maxou", detail: "18/23 passes", buts: 1, pd: 0, note: "7,0", ton: "neutre", hdm: false, rouge: false },
            { poste: "G", nom: "Nico", detail: "3 arrêts", buts: 0, pd: 0, note: "6,4", ton: "ambre", hdm: false, rouge: false },
          ],
          butsSansJoueur: 0,
          stat: { texte: "Kev · 31 passes réussies sur 35", valeur: "89 %", ratio: 0.886 },
        },
      };

      const flux = new FluxStreamKit(BASE + "/flux");

      if (new URLSearchParams(location.search).has("demo")) {
        appliquer(DEMO);
      } else {
        flux.addEventListener("etat", (e) => appliquer(JSON.parse(e.data)));
        flux.addEventListener("error", () => {
          if (flux.readyState === FluxStreamKit.CLOSED) cadre.classList.remove("visible");
        });
      }
    </script>
  </body>
</html>
