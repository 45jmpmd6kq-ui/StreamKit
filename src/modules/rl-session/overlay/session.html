<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>StreamKit — compteur de session Rocket League</title>
    <style>
      /* Fond transparent obligatoire : OBS incruste la page telle quelle. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      :root {
        --victoire: #3ddc84;
        --defaite: #ff4d5e;
        --or: #ffd24a;
        --gris: #a8a8bd;
        /* Bahnschrift est livrée avec Windows 10 et 11 : même famille que le
           scoreboard des prédictions, sans police à télécharger. */
        --typo: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        font-family: var(--typo);
        color: #fff;
      }
      body[data-coin="top-left"] { align-items: flex-start; justify-content: flex-start; }
      body[data-coin="top-center"] { align-items: flex-start; justify-content: center; }
      body[data-coin="top-right"] { align-items: flex-start; justify-content: flex-end; }
      body[data-coin="bottom-left"] { align-items: flex-end; justify-content: flex-start; }
      body[data-coin="bottom-center"] { align-items: flex-end; justify-content: center; }
      body[data-coin="bottom-right"] { align-items: flex-end; justify-content: flex-end; }

      .nb { font-variant-numeric: tabular-nums; }

      #carte {
        box-sizing: border-box;
        width: 250px;
        margin: 24px;
        /* Pas de titre : le haut des chiffres et le pied de la serie sont a la
           meme distance du bord (17 px), d'ou le haut a 13 et le bas a 12. */
        padding: 13px 18px 12px;
        border-radius: 18px;
        background: rgba(14, 16, 24, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #carte.visible { opacity: 1; transform: none; }

      .score { display: flex; align-items: baseline; justify-content: center; gap: 14px; }
      /* Le W et le L collent au chiffre : une ligne de moins qu'avec les mots
         sous le score, donc une carte plus basse a l'ecran. */
      .paire { display: inline-flex; align-items: baseline; gap: 3px; }
      .paire.victoires { color: var(--victoire); }
      .paire.defaites { color: var(--defaite); }
      .gros { font-size: 46px; font-weight: 700; line-height: 1; }
      .lettre { font-size: 20px; font-weight: 700; line-height: 1; opacity: 0.75; }
      .tiret { font-size: 26px; color: rgba(255, 255, 255, 0.4); }

      /* Le chiffre qui vient de bouger saute : on voit tout de suite ce qui a changé. */
      .saut { animation: saut 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
      @keyframes saut {
        0% { transform: scale(1); }
        35% { transform: scale(1.28); }
        100% { transform: scale(1); }
      }

      .serie {
        margin-top: 8px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--gris);
        min-height: 18px;
      }
      .serie.victoires { color: var(--or); }
      .serie.defaites { color: var(--defaite); }
    </style>
  </head>
  <body data-coin="top-left">
    <div id="carte">
      <div class="score nb">
        <span class="paire victoires"><span class="gros" id="victoires">0</span><span class="lettre">W</span></span>
        <span class="tiret">–</span>
        <span class="paire defaites"><span class="gros" id="defaites">0</span><span class="lettre">L</span></span>
      </div>
      <div class="serie" id="serie"></div>
    </div>

    <script>
      const carte = document.getElementById('carte');
      const $ = (id) => document.getElementById(id);

      function appliquerTheme(t) {
        if (t?.coin) document.body.dataset.coin = t.coin;
      }

      // Change le chiffre, et le fait sauter s'il a vraiment bougé.
      function chiffre(el, valeur) {
        const texte = String(valeur);
        if (el.textContent === texte) return;
        const premier = el.dataset.vu !== '1';
        el.textContent = texte;
        el.dataset.vu = '1';
        if (premier) return;
        const bloc = el.closest('.paire');
        bloc.classList.remove('saut');
        void bloc.offsetWidth; // relance l'animation même si elle vient de jouer
        bloc.classList.add('saut');
      }

      function appliquer(etat) {
        appliquerTheme(etat?.theme);
        const s = etat?.session;
        if (!s) return;

        chiffre($('victoires'), s.victoires);
        chiffre($('defaites'), s.defaites);

        const serie = $('serie');
        serie.className = 'serie';
        if (!s.serie) {
          serie.textContent = 'En attente de la première partie';
        } else if (s.serie.n >= 2) {
          serie.classList.add(s.serie.victoire ? 'victoires' : 'defaites');
          serie.textContent = s.serie.victoire
            ? '🔥 ' + s.serie.n + ' victoires d’affilée'
            : s.serie.n + ' défaites d’affilée';
        } else {
          serie.textContent = 'Dernière partie : ' + (s.serie.victoire ? 'victoire' : 'défaite');
        }
        carte.classList.add('visible');
      }

      // ?demo=1 : une session d'exemple, le temps de placer la source dans OBS.
      // À retirer une fois calé.
      const demo = new URLSearchParams(location.search).has('demo');

      // Chemin construit depuis location.pathname : un relatif remplacerait le
      // dernier segment de l'URL et taperait /overlay/rl-session/flux.
      const BASE = location.pathname.replace(/\/$/, '');
      const flux = new EventSource(BASE + '/flux');

      if (demo) {
        flux.addEventListener('etat', (m) => appliquerTheme(JSON.parse(m.data).theme));
        appliquer({
          session: { victoires: 7, defaites: 3, serie: { victoire: true, n: 3 } },
        });
      } else {
        flux.addEventListener('etat', (m) => appliquer(JSON.parse(m.data)));
      }
    </script>
  </body>
</html>
