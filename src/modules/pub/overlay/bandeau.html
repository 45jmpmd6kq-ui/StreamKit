<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>StreamKit — annonce de pub</title>
    <style>
      /* Fond transparent obligatoire : OBS incruste la page telle quelle. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      :root {
        --twitch: #9146ff;
        --violet: #c3a6ff;
        --or: #ffd24a;
        --fond: rgba(14, 14, 20, 0.94);
        /* Même famille que le scoreboard des prédictions : Bahnschrift, livrée avec Windows. */
        --typo: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        font-family: var(--typo);
        color: #fff;
      }
      body[data-coin="top-left"] { align-items: flex-start; justify-content: flex-start; }
      body[data-coin="top-center"] { align-items: flex-start; justify-content: center; }
      body[data-coin="top-right"] { align-items: flex-start; justify-content: flex-end; }
      body[data-coin="bottom-left"] { align-items: flex-end; justify-content: flex-start; }
      body[data-coin="bottom-center"] { align-items: flex-end; justify-content: center; }
      body[data-coin="bottom-right"] { align-items: flex-end; justify-content: flex-end; }

      .nb { font-variant-numeric: tabular-nums; }

      #pub {
        width: 530px;
        margin: 24px;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        opacity: 0;
        transform: translateX(-30px);
        transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
      }
      body[data-coin$="right"] #pub { transform: translateX(30px); }
      #pub.visible { opacity: 1; transform: none; }

      .corps { display: grid; grid-template-columns: 88px 1fr; height: 78px; }

      .ico {
        display: grid;
        place-items: center;
        font-size: 32px;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
        background: linear-gradient(100deg, rgba(0, 0, 0, 0.25), rgba(255, 255, 255, 0.1)), var(--twitch);
        clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
      }

      .txt {
        margin-left: -8px;
        padding: 0 24px 0 28px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        align-content: center;
        column-gap: 16px;
        row-gap: 3px;
        background: var(--fond);
        clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
      }
      .etiquette {
        grid-column: 1;
        grid-row: 1;
        align-self: end;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--violet);
        white-space: nowrap;
      }
      /* Placement explicite : sans chrono (phase « fin »), la phrase remonterait
         sinon d'elle-même sur la première ligne. */
      .phrase {
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        font-size: 15.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chrono {
        grid-row: 1 / 3;
        grid-column: 2;
        align-self: center;
        font-size: 34px;
        font-weight: 700;
        color: var(--or);
      }
      #pub[data-phase="pendant"] .chrono { color: #fff; }
      #pub[data-phase="fin"] .chrono { display: none; }
      #pub[data-phase="fin"] .etiquette { color: var(--or); }
      .urgent { animation: pouls 1s ease-in-out infinite; }
      @keyframes pouls { 50% { transform: scale(1.12); } }

      .barre {
        margin: 0 16px 0 80px;
        height: 5px;
        background: var(--fond);
        clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 100%, 5px 100%);
      }
      .barre i {
        display: block;
        width: 0;
        height: 100%;
        background: var(--or);
        transition: width 1s linear;
      }
      #pub[data-phase="pendant"] .barre i,
      #pub[data-phase="fin"] .barre i { background: var(--twitch); }
    </style>
  </head>
  <body data-coin="bottom-left">
    <div id="pub" data-phase="">
      <div class="corps">
        <div class="ico" id="ico" aria-hidden="true">📺</div>
        <div class="txt">
          <div class="etiquette" id="etiquette">Pause pub dans</div>
          <div class="chrono nb" id="chrono">0:00</div>
          <div class="phrase" id="phrase"></div>
        </div>
      </div>
      <div class="barre"><i id="avance"></i></div>
    </div>

    <script>
      const bloc = document.getElementById('pub');
      const $ = (id) => document.getElementById(id);

      let theme = { phraseAvant: 'Profitez-en pour boire un verre 🥤', phrasePendant: 'Les abonnés ne voient pas les pubs 💜' };
      let annonce = null;

      function appliquerTheme(t) {
        if (!t) return;
        theme = { ...theme, ...t };
        if (t.coin) document.body.dataset.coin = t.coin;
      }

      const minSec = (ms) => {
        const s = Math.max(0, Math.ceil(ms / 1000));
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      };

      // Recalculé chaque seconde sur l'horloge du PC : le serveur n'envoie que
      // les changements de phase, pas un chrono qui saccaderait.
      function dessiner() {
        if (!annonce) {
          bloc.classList.remove('visible');
          return;
        }
        const maintenant = Date.now();
        const reste = annonce.cible - maintenant;
        bloc.dataset.phase = annonce.phase;

        if (annonce.phase === 'avant') {
          $('ico').textContent = '📺';
          $('etiquette').textContent = reste > 0 ? 'Pause pub dans' : 'Pause pub imminente';
          $('phrase').textContent = theme.phraseAvant || '';
        } else if (annonce.phase === 'pendant') {
          $('ico').textContent = '⏸️';
          $('etiquette').textContent = 'Pub en cours · retour dans';
          $('phrase').textContent = theme.phrasePendant || '';
        } else {
          $('ico').textContent = '▶️';
          $('etiquette').textContent = 'C’est reparti !';
          $('phrase').textContent = 'Merci de votre patience 💜';
        }
        $('chrono').textContent = minSec(reste);
        $('chrono').classList.toggle('urgent', annonce.phase === 'avant' && reste > 0 && reste <= 10000);

        const total = annonce.cible - annonce.depuis;
        const fait = total > 0 ? Math.min(1, Math.max(0, (maintenant - annonce.depuis) / total)) : 1;
        $('avance').style.width = (annonce.phase === 'fin' ? 100 : fait * 100) + '%';
        bloc.classList.add('visible');
      }
      setInterval(dessiner, 1000);

      function appliquer(etat) {
        appliquerTheme(etat?.theme);
        annonce = etat?.annonce ?? null;
        dessiner();
      }

      // ?demo=1 : un avertissement qui tourne en boucle, le temps de placer la
      // source dans OBS. ?demo=pendant et ?demo=fin montrent les autres phases.
      const demo = new URLSearchParams(location.search).get('demo');

      // Chemin construit depuis location.pathname : un relatif remplacerait le
      // dernier segment de l'URL et taperait /overlay/pub/flux.
      const BASE = location.pathname.replace(/\/$/, '');
      const flux = new EventSource(BASE + '/flux');

      if (demo !== null) {
        flux.addEventListener('etat', (m) => appliquerTheme(JSON.parse(m.data).theme));
        const phase = ['pendant', 'fin'].includes(demo) ? demo : 'avant';
        const boucle = () => {
          const t = Date.now();
          const duree = phase === 'fin' ? 3600000 : 60000;
          appliquer({ annonce: { phase, depuis: t - (phase === 'avant' ? 15000 : 7000), cible: t + (phase === 'avant' ? 45000 : 83000), duree } });
        };
        boucle();
        setInterval(() => {
          if (annonce && annonce.cible <= Date.now()) boucle();
        }, 1000);
      } else {
        flux.addEventListener('etat', (m) => appliquer(JSON.parse(m.data)));
      }
    </script>
  </body>
</html>
