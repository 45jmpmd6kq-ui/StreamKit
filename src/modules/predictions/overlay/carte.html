<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>StreamKit — prédiction en cours</title>
    <style>
      /* Fond transparent obligatoire : OBS incruste la page telle quelle. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      :root {
        --bleu: #2f7cff;
        --rose: #e8409a;
        /* Mêmes couleurs en triplets RVB, pour les teintes transparentes :
           color-mix() n'existe pas dans le navigateur des OBS antérieurs à la 31. */
        --bleu-rvb: 47, 124, 255;
        --rose-rvb: 232, 64, 154;
        --fond: rgba(14, 14, 20, 0.94);
        --violet: #c3a6ff;
        --or: #ffd24a;
        --gris: #a9a9bf;
        /* Bahnschrift est livrée avec Windows 10 et 11 : le côté « diffusion esport »
           sans police à télécharger (la CSP des overlays l'interdirait de toute façon). */
        --typo: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        font-family: var(--typo);
        color: #fff;
      }
      body[data-coin="top-left"] { align-items: flex-start; justify-content: flex-start; }
      body[data-coin="top-center"] { align-items: flex-start; justify-content: center; }
      body[data-coin="top-right"] { align-items: flex-start; justify-content: flex-end; }
      body[data-coin="bottom-left"] { align-items: flex-end; justify-content: flex-start; }
      body[data-coin="bottom-center"] { align-items: flex-end; justify-content: center; }
      body[data-coin="bottom-right"] { align-items: flex-end; justify-content: flex-end; }

      .nb { font-variant-numeric: tabular-nums; }

      #sb {
        width: 640px;
        margin: 24px;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.5));
        /* Au repos l'overlay est totalement invisible : pas de cadre vide à l'écran. */
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #sb.visible { opacity: 1; }

      /* Entrée façon diffusion : le bandeau tombe, les blocs arrivent des côtés. */
      .tete, .bloc, .centre, .pied, .rang {
        transition: transform 0.55s cubic-bezier(0.2, 1, 0.3, 1), filter 0.5s ease, opacity 0.5s ease;
      }
      #sb:not(.visible) .tete { transform: translateY(-18px); }
      #sb:not(.visible) .bloc.g { transform: translateX(-46px); }
      #sb:not(.visible) .bloc.d { transform: translateX(46px); }
      #sb:not(.visible) .centre { transform: scale(0.6); }
      #sb:not(.visible) .pied { transform: translateY(10px); }
      #sb:not(.visible) .rang { transform: translateX(-30px); }
      #sb.visible .bloc, #sb.visible .rang { transition-delay: 0.08s; }
      #sb.visible .centre { transition-delay: 0.16s; }

      /* --- Bandeau de titre --- */
      .tete {
        margin: 0 34px;
        padding: 7px 30px 8px;
        text-align: center;
        background: var(--fond);
        clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
      }
      .etiquette {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--violet);
        transition: color 0.3s;
      }
      #sb[data-statut="verrouillee"] .etiquette { color: var(--or); }
      #sb[data-statut="annulee"] .etiquette { color: #ff8a8a; }
      .titre {
        display: block;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Emoji en police couleur : Bahnschrift n'a pas ce glyphe, le système prend le relais. */
      .titre .ico {
        margin-right: 10px;
        font-size: 1.15em;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
        /* Les épées sont grises : sans halo clair, elles se perdent dans le bandeau noir. */
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.45));
      }

      /* --- Duel : deux issues face à face --- */
      .duel { display: grid; grid-template-columns: 1fr 96px 1fr; height: 102px; }
      #sb[data-mode="liste"] .duel { display: none; }

      .bloc {
        --c: var(--bleu);
        --c-rvb: var(--bleu-rvb);
        position: relative;
        overflow: hidden;
        padding: 10px 24px 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        /* Un voile sombre en dégradé par-dessus la couleur choisie : du relief,
           quelle que soit la teinte réglée dans le dashboard. */
        background: linear-gradient(100deg, rgba(0, 0, 0, 0.3), rgba(255, 255, 255, 0.1)), var(--c);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      [data-couleur="rose"] { --c: var(--rose); --c-rvb: var(--rose-rvb); }
      .bloc.g { clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); }
      .bloc.d {
        clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%);
        background: linear-gradient(260deg, rgba(0, 0, 0, 0.3), rgba(255, 255, 255, 0.1)), var(--c);
        text-align: right;
        align-items: flex-end;
      }
      /* flex-shrink: 0 : un enfant en overflow hidden serait sinon écrasé par la
         colonne flex, et le nom de l'issue passerait sous la ligne de détail. */
      .bloc > * { flex-shrink: 0; }
      .bloc .pc { font-size: 44px; font-weight: 700; line-height: 0.95; }
      .bloc .nom {
        max-width: 100%;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        line-height: 1.2;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bloc .det { font-size: 12.5px; line-height: 1.2; opacity: 0.88; }
      .rempl {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 5px;
        background: rgba(255, 255, 255, 0.9);
        transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .bloc.d .rempl { left: auto; right: 0; }

      .tag {
        display: none;
        position: absolute;
        top: 8px;
        padding: 2px 8px 3px;
        border-radius: 3px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #111;
        background: var(--or);
        text-shadow: none;
      }
      .bloc.g .tag { right: 34px; }
      .bloc.d .tag { left: 34px; }
      .gagnant .tag { display: block; }

      /* Résultat : le perdant s'éteint, le gagnant reçoit un reflet qui le traverse. */
      .perdant,
      #sb[data-statut="annulee"] .bloc,
      #sb[data-statut="annulee"] .rang { filter: grayscale(0.85) brightness(0.55); }
      .gagnant::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.45) 50%, transparent 70%);
        transform: translateX(-120%);
        animation: reflet 1.1s 0.2s ease-out forwards;
      }
      @keyframes reflet { to { transform: translateX(120%); } }

      .centre {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        background: var(--fond);
      }
      .vs { font-size: 22px; font-weight: 700; font-style: italic; }
      .chrono { font-size: 20px; font-weight: 700; color: var(--or); line-height: 1.1; }
      .chrono.urgent { color: #ff5d5d; animation: pouls 1s ease-in-out infinite; }
      #sb[data-statut="annulee"] .chrono { color: #ff6b6b; }
      @keyframes pouls { 50% { transform: scale(1.14); } }
      .sous { font-size: 9px; letter-spacing: 2px; color: var(--gris); text-transform: uppercase; }

      /* --- Liste : trois issues ou plus (Twitch en permet dix) --- */
      .liste { display: none; flex-direction: column; gap: 4px; padding: 4px 0; }
      #sb[data-mode="liste"] .liste { display: flex; }
      .rang { --c: var(--bleu); --c-rvb: var(--bleu-rvb); position: relative; display: grid; grid-template-columns: 88px 1fr; height: 40px; }
      .rang .pc {
        display: grid;
        place-items: center;
        font-size: 21px;
        font-weight: 700;
        background: linear-gradient(100deg, rgba(0, 0, 0, 0.3), rgba(255, 255, 255, 0.1)), var(--c);
        clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .rang .piste {
        position: relative;
        overflow: hidden;
        margin-left: -8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 18px 0 20px;
        background: var(--fond);
        clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      }
      .rang .jauge {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        /* Pas de trait vertical au bout : sur une petite part, il barrait le nom. */
        background: linear-gradient(90deg, rgba(var(--c-rvb), 0.2), rgba(var(--c-rvb), 0.45));
        transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .rang .nom, .rang .det { position: relative; white-space: nowrap; }
      .rang .nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; }
      .rang .det { font-size: 12px; color: #d4d4e4; }
      .rang .tag { position: relative; top: auto; margin-right: 8px; }
      .rang.gagnant .tag { display: inline-block; }
      #sb.compacte .rang { height: 32px; }
      #sb.compacte .rang .pc { font-size: 17px; }
      #sb.compacte .rang .nom { font-size: 13px; }

      /* --- Pied --- */
      /* Les chiffres sont regroupés au centre, sous le VS, séparés par un trait
         biseauté qui reprend l'angle des blocs. */
      .pied {
        margin: 0 34px;
        padding: 5px 22px 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font-size: 13px;
        color: #c9c9dd;
        background: var(--fond);
        clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 16px 100%);
      }
      .pied b { color: #fff; }
      .sep {
        width: 2px;
        height: 12px;
        background: var(--violet);
        opacity: 0.7;
        transform: skewX(-20deg);
      }
      /* Le chrono ne descend dans le pied qu'en mode liste : en duel, il est au centre. */
      .pied-chrono,
      .sep-chrono { display: none; }
      .pied-chrono { font-weight: 700; color: var(--or); }
      #sb[data-mode="liste"] .pied-chrono,
      #sb[data-mode="liste"] .sep-chrono { display: block; }
      .pied-chrono.urgent { color: #ff5d5d; }
    </style>
  </head>
  <body data-coin="top-right">
    <div id="sb" data-statut="active" data-mode="duel">
      <div class="tete">
        <span class="etiquette" id="etiquette">Prédiction en direct</span>
        <span class="titre"><span class="ico" aria-hidden="true">⚔️</span><span id="titre"></span></span>
      </div>

      <div class="duel">
        <div class="bloc g" id="bloc-g">
          <span class="tag">Gagnant</span>
          <div class="pc nb">0%</div>
          <div class="nom"></div>
          <div class="det nb"></div>
          <div class="rempl"></div>
        </div>
        <div class="centre">
          <div class="vs" id="vs">VS</div>
          <div class="chrono nb" id="chrono"></div>
          <div class="sous" id="sous"></div>
        </div>
        <div class="bloc d" id="bloc-d">
          <span class="tag">Gagnant</span>
          <div class="pc nb">0%</div>
          <div class="nom"></div>
          <div class="det nb"></div>
          <div class="rempl"></div>
        </div>
      </div>

      <div class="liste" id="liste"></div>

      <div class="pied nb">
        <span><b id="total-points">0</b> <span id="lib-points">point en jeu</span></span>
        <i class="sep" aria-hidden="true"></i>
        <span><b id="total-votants">0</b> <span id="lib-votants">participant</span></span>
        <i class="sep sep-chrono" aria-hidden="true"></i>
        <span class="pied-chrono" id="pied-chrono"></span>
      </div>
    </div>

    <script>
      const sb = document.getElementById('sb');
      const $ = (id) => document.getElementById(id);

      const ETIQUETTES = {
        active: 'Prédiction en direct',
        verrouillee: 'Votes fermés · résultat à venir',
        resolue: 'Résultat de la prédiction',
        annulee: 'Prédiction annulée · points remboursés',
      };
      // Le centre du duel : [grand, petit] selon l'état. L'état actif affiche le chrono.
      const CENTRES = {
        verrouillee: ['🔒', 'Votes fermés'],
        resolue: ['🏆', 'Terminée'],
        annulee: ['✕', 'Annulée'],
      };
      const PIEDS = { verrouillee: 'Votes fermés', resolue: 'Terminée', annulee: 'Remboursée' };

      // Nombres à la française : « 13 421 », espace insécable fine.
      const nombre = new Intl.NumberFormat('fr-FR');
      // En français, 0 et 1 restent au singulier.
      const accord = (n, singulier, plurielle) => (n >= 2 ? plurielle : singulier);

      // « #2f7cff » -> « 47, 124, 255 » ; null si la couleur n'est pas lisible.
      function rvb(hex) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
        if (!m) return null;
        const n = parseInt(m[1], 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(', ');
      }

      function appliquerTheme(t) {
        if (!t) return;
        const racine = document.documentElement.style;
        for (const nom of ['bleu', 'rose']) {
          const triplet = rvb(t[nom]);
          if (!triplet) continue;
          racine.setProperty('--' + nom, t[nom]);
          racine.setProperty('--' + nom + '-rvb', triplet);
        }
        if (t.coin) document.body.dataset.coin = t.coin;
      }

      // Les chiffres défilent jusqu'à leur nouvelle valeur au lieu de sauter.
      function animer(el, cible, format) {
        const depart = el._valeur ?? 0;
        el._valeur = cible;
        cancelAnimationFrame(el._anim);
        // Page non affichée (scène OBS inactive, onglet caché) : le navigateur y
        // suspend requestAnimationFrame, et le chiffre resterait figé sur l'ancien.
        if (depart === cible || document.hidden) {
          el.textContent = format(cible);
          return;
        }
        const debut = performance.now();
        const pas = (t) => {
          const k = Math.min(1, (t - debut) / 650);
          const doux = 1 - Math.pow(1 - k, 3);
          el.textContent = format(Math.round(depart + (cible - depart) * doux));
          if (k < 1) el._anim = requestAnimationFrame(pas);
        };
        el._anim = requestAnimationFrame(pas);
      }

      function element(balise, classe, parent) {
        const el = document.createElement(balise);
        if (classe) el.className = classe;
        if (parent) parent.appendChild(el);
        return el;
      }

      // --- Construction ------------------------------------------------------------
      // Une ligne par issue, gardée d'une mise à jour à l'autre : la reconstruire
      // à chaque vote couperait l'animation des barres.
      let lignes = new Map();
      let signature = '';

      // Deux issues : les blocs du duel existent déjà, on les rattache.
      function rattacherBloc(id, o) {
        const el = $(id);
        const refs = {
          el,
          pc: el.querySelector('.pc'),
          nom: el.querySelector('.nom'),
          det: el.querySelector('.det'),
          barre: el.querySelector('.rempl'),
        };
        // Nouvelle prédiction : les chiffres et la barre repartent de zéro.
        refs.pc._valeur = 0;
        refs.det._valeur = 0;
        refs.barre.style.transition = 'none';
        refs.barre.style.width = '0';
        void refs.barre.offsetWidth;
        refs.barre.style.transition = '';
        lignes.set(o.id, refs);
      }

      function construireListe(p) {
        const zone = $('liste');
        for (const o of p.issues) {
          const el = element('div', 'rang', zone);
          const pc = element('div', 'pc nb', el);
          const piste = element('div', 'piste', el);
          const barre = element('div', 'jauge', piste);
          const nomBloc = element('div', 'nom', piste);
          element('span', 'tag', nomBloc).textContent = 'Gagnant';
          const nom = element('span', '', nomBloc);
          const det = element('div', 'det nb', piste);
          lignes.set(o.id, { el, pc, nom, det, barre });
        }
        void zone.offsetWidth; // la jauge part de zéro et glisse
      }

      function construire(p) {
        lignes = new Map();
        $('liste').replaceChildren();
        const duel = p.issues.length === 2;
        sb.dataset.mode = duel ? 'duel' : 'liste';
        if (duel) {
          rattacherBloc('bloc-g', p.issues[0]);
          rattacherBloc('bloc-d', p.issues[1]);
        } else {
          construireListe(p);
        }
      }

      // --- Rendu -----------------------------------------------------------------
      let courante = null;

      function appliquer(etat) {
        appliquerTheme(etat?.theme);
        const p = etat?.prediction;
        if (!p || !Array.isArray(p.issues) || !p.issues.length) {
          courante = null;
          sb.classList.remove('visible');
          return;
        }

        const sig = p.id + '|' + p.issues.map((o) => o.id).join(',');
        if (sig !== signature) {
          construire(p);
          signature = sig;
        }

        sb.dataset.statut = p.statut;
        sb.classList.toggle('compacte', p.issues.length > 5);
        $('etiquette').textContent = ETIQUETTES[p.statut] || ETIQUETTES.active;
        $('titre').textContent = p.titre;

        const resolue = p.statut === 'resolue' && p.gagnant;
        for (const o of p.issues) {
          const l = lignes.get(o.id);
          if (!l) continue;
          l.el.dataset.couleur = o.couleur === 'rose' ? 'rose' : 'bleu';
          l.nom.textContent = o.titre;
          animer(l.pc, o.pourcent, (v) => v + '%');
          animer(
            l.det,
            o.points,
            (v) => nombre.format(v) + ' pts · ' + o.votants + ' ' + accord(o.votants, 'votant', 'votants')
          );
          l.barre.style.width = o.pourcent + '%';
          l.el.classList.toggle('gagnant', !!resolue && o.id === p.gagnant);
          l.el.classList.toggle('perdant', !!resolue && o.id !== p.gagnant);
        }

        animer($('total-points'), p.totalPoints, (v) => nombre.format(v));
        animer($('total-votants'), p.totalVotants, String);
        $('lib-points').textContent = accord(p.totalPoints, 'point en jeu', 'points en jeu');
        $('lib-votants').textContent = accord(p.totalVotants, 'participant', 'participants');

        courante = p;
        majTemps();
        sb.classList.add('visible');
      }

      function majTemps() {
        const p = courante;
        if (!p) return;
        const chrono = $('chrono');
        const piedChrono = $('pied-chrono');

        if (p.statut !== 'active') {
          const [grand, petit] = CENTRES[p.statut] || ['', ''];
          $('vs').textContent = p.statut === 'resolue' ? 'FIN' : 'VS';
          chrono.textContent = grand;
          $('sous').textContent = petit;
          piedChrono.textContent = PIEDS[p.statut] || '';
          chrono.classList.remove('urgent');
          piedChrono.classList.remove('urgent');
          return;
        }

        $('vs').textContent = 'VS';
        const reste = p.verrouA ? Math.max(0, Math.ceil((p.verrouA - Date.now()) / 1000)) : null;
        const texte =
          reste == null ? '' : Math.floor(reste / 60) + ':' + String(reste % 60).padStart(2, '0');
        chrono.textContent = texte;
        $('sous').textContent = reste === 0 ? 'Clôture…' : 'Restant';
        piedChrono.textContent = reste == null ? '' : reste === 0 ? 'Clôture…' : texte + ' restant';
        const urgent = reste != null && reste > 0 && reste <= 10;
        chrono.classList.toggle('urgent', urgent);
        piedChrono.classList.toggle('urgent', urgent);
      }
      setInterval(majTemps, 250);

      // --- Démo --------------------------------------------------------------------
      // ?demo=1 : une prédiction d'exemple qui ne disparaît pas, le temps de placer
      // la source dans OBS. À retirer une fois calé. ?demo=verrouillee, resolue,
      // annulee ou multi (quatre issues) montrent les autres cas.
      const demo = new URLSearchParams(location.search).get('demo');

      function exemple(statut, multi = false) {
        const issues = multi
          ? [
              { id: 'm1', titre: 'Top 1', couleur: 'bleu', votants: 17, points: 5200, pourcent: 45 },
              { id: 'm2', titre: 'Top 2-3', couleur: 'bleu', votants: 10, points: 3100, pourcent: 27 },
              { id: 'm3', titre: 'Top 4-5', couleur: 'bleu', votants: 8, points: 2400, pourcent: 21 },
              { id: 'm4', titre: 'Au-delà', couleur: 'bleu', votants: 3, points: 800, pourcent: 7 },
            ]
          : [
              { id: 'demo-bleu', titre: '✅ Victoire', couleur: 'bleu', votants: 14, points: 13421, pourcent: 75 },
              { id: 'demo-rose', titre: '❌ Défaite', couleur: 'rose', votants: 3, points: 4444, pourcent: 25 },
            ];
        return {
          theme: null,
          prediction: {
            id: multi ? 'demo-multi' : 'demo',
            titre: multi ? 'Quel classement ce soir ?' : 'Victoire ou défaite ?',
            statut,
            verrouA: statut === 'active' ? Date.now() + 95000 : null,
            gagnant: statut === 'resolue' ? issues[0].id : null,
            issues,
            totalPoints: issues.reduce((s, o) => s + o.points, 0),
            totalVotants: issues.reduce((s, o) => s + o.votants, 0),
          },
        };
      }

      // Chemin construit depuis location.pathname : un relatif remplacerait le
      // dernier segment de l'URL et taperait /overlay/predictions/flux.
      const BASE = location.pathname.replace(/\/$/, '');
      const flux = new EventSource(BASE + '/flux');

      if (demo !== null) {
        const statut = ['verrouillee', 'resolue', 'annulee'].includes(demo) ? demo : 'active';
        // En démo on n'écoute que le thème : l'état vide envoyé à la connexion
        // effacerait sinon l'exemple aussitôt.
        flux.addEventListener('etat', (m) => appliquerTheme(JSON.parse(m.data).theme));
        appliquer(exemple(statut, demo === 'multi'));
        // Le compte à rebours repart au lieu de rester sur « Clôture ».
        setInterval(() => {
          if (courante?.statut === 'active' && courante.verrouA < Date.now()) courante.verrouA = Date.now() + 95000;
        }, 1000);
      } else {
        flux.addEventListener('etat', (m) => appliquer(JSON.parse(m.data)));
      }
    </script>
  </body>
</html>
