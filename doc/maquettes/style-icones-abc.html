<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icônes et style — pistes A, B, C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Planche ===== */
  * { box-sizing: border-box; }
  body { margin: 0; background: #08080b; color: #e9e9f2; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px 16px 48px; }
  .planche { max-width: 1300px; margin: 0 auto; }
  .intro h1 { font-size: 24px; margin: 0 0 4px; }
  .intro p { color: #9797ab; margin: 0; max-width: 900px; }
  .onglets { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; }
  .onglets button { background: #14141b; color: #e9e9f2; border: 1px solid #272733; border-radius: 999px; padding: 7px 16px; font: inherit; cursor: pointer; }
  .onglets button[aria-selected="true"] { background: #9146ff; border-color: #9146ff; color: #fff; }
  .explication { color: #b9b9ca; background: #111117; border: 1px solid #22222c; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .explication b { color: #fff; }
  .explication ul { margin: 6px 0 0; padding-left: 18px; }
  .vues { display: grid; gap: 20px; }
  .legende-vue { color: #82829a; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }

  /* ===== Application (jetons par piste) ===== */
  .app {
    --fond: #0d0d12; --panneau: #14141b; --panneau-clair: #1b1b24; --bordure: #272733; --bordure-vive: #35354a;
    --texte: #e9e9f2; --texte-doux: #9797ab; --texte-faible: #82829a;
    --accent: #9146ff; --accent-doux: #9146ff22; --primaire: #9146ff;
    --succes: #22c55e; --avert: #f59e0b; --erreur: #f43f5e;
    --rayon: 10px; --police-titre: inherit; --police-chiffre: inherit;
    --ic-taille: 18px;
    background: var(--fond); color: var(--texte); border: 1px solid #22222c; border-radius: 12px; overflow: hidden;
    display: grid; grid-template-rows: 52px auto; height: 700px;
  }
  .app.b {
    --fond: #05070d; --panneau: #0b1020; --panneau-clair: #111a2e; --bordure: #1e293b; --bordure-vive: #334155;
    --texte: #f1f5f9; --texte-doux: #94a3b8; --texte-faible: #7c8aa0;
    --accent: #22c55e; --accent-doux: #22c55e1f; --primaire: #22c55e;
    --rayon: 4px; --police-titre: Orbitron, "Segoe UI", sans-serif; --police-chiffre: "JetBrains Mono", Consolas, monospace;
  }
  .app svg.i { width: var(--ic-taille); height: var(--ic-taille); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app .emo { width: var(--ic-taille); text-align: center; flex: none; }

  .barre { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panneau); border-bottom: 1px solid var(--bordure); }
  .marque { font-weight: 700; font-family: var(--police-titre); letter-spacing: .02em; }
  .b .marque { text-transform: uppercase; letter-spacing: .12em; font-size: 13px; }
  .marque small { color: var(--texte-faible); font-weight: 400; margin-left: 6px; font-family: var(--police-chiffre); }
  .pastille { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--bordure); border-radius: 999px; padding: 4px 12px; color: var(--texte-doux); font-size: 13px; }
  .pousse { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panneau-clair); border: 1px solid var(--bordure-vive); border-radius: 8px; padding: 6px 12px; color: var(--texte); font: inherit; font-size: 13px; cursor: pointer; }
  .b .btn { border-radius: var(--rayon); }
  .btn.discret { background: transparent; border-color: transparent; padding: 6px; }
  .btn.primaire { background: var(--primaire); border-color: var(--primaire); color: #fff; font-weight: 600; }
  .b .btn.primaire { color: #04130a; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

  .corps { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  .rail { background: var(--panneau); border-right: 1px solid var(--bordure); padding: 10px; overflow: hidden; }
  .entree { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--texte); font-weight: 600; font-size: 13.5px; border: 1px solid transparent; }
  .entree .ic { color: var(--texte-doux); display: inline-flex; }
  .entree.actif { background: var(--accent-doux); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .entree.actif .ic { color: var(--accent); }
  .b .entree.actif { box-shadow: inset 3px 0 0 var(--accent); border-color: transparent; border-radius: 2px; }
  .point { width: 7px; height: 7px; border-radius: 50%; background: var(--bordure-vive); flex: none; }
  .point.ok { background: var(--succes); } .point.av { background: var(--avert); } .point.ko { background: var(--erreur); }
  .b .point { border-radius: 1px; }
  .rail h2 { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--texte-faible); margin: 14px 10px 6px; font-family: var(--police-titre); }
  .groupe-t { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; }
  .groupe-t .compte { margin-left: auto; color: var(--texte-doux); font-size: 12px; font-family: var(--police-chiffre); display: inline-flex; gap: 6px; align-items: center; }
  .sous { padding-left: 18px; font-weight: 500; }
  .c .groupe-t .ic { color: var(--univers); }
  .c .sous .ic { color: color-mix(in srgb, var(--univers) 70%, var(--texte-doux)); }

  .detail { padding: 22px 26px; overflow: hidden; display: grid; gap: 16px; align-content: start; }
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; background: linear-gradient(120deg, color-mix(in srgb, var(--erreur) 10%, var(--panneau)), var(--panneau)); border: 1px solid var(--bordure); border-radius: 14px; padding: 18px 24px; }
  .b .hero { border-radius: var(--rayon); background: var(--panneau); border-color: color-mix(in srgb, var(--erreur) 35%, var(--bordure)); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .hero h1 { margin: 0 0 4px; font-size: 22px; font-family: var(--police-titre); }
  .b .hero h1 { font-size: 18px; text-transform: uppercase; letter-spacing: .06em; }
  .hero p { margin: 0; color: var(--texte-doux); font-size: 13px; }
  .anneau text { font: 700 17px var(--police-chiffre, inherit); fill: var(--texte); }
  .stats { display: flex; gap: 8px; }
  .stat { background: var(--panneau-clair); border: 1px solid var(--bordure); border-radius: 10px; padding: 8px 14px; min-width: 96px; }
  .b .stat { border-radius: var(--rayon); }
  .stat b { display: block; font-size: 20px; font-family: var(--police-chiffre); }
  .stat span { color: var(--texte-doux); font-size: 12px; }
  .stat.alerte { border-color: color-mix(in srgb, var(--erreur) 50%, transparent); } .stat.alerte b { color: var(--erreur); }

  .titre-s { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--texte-faible); font-family: var(--police-titre); }
  .conns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cx { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; background: var(--panneau); border: 1px solid var(--bordure); border-radius: 12px; padding: 10px 14px; }
  .b .cx { border-radius: var(--rayon); }
  .cx .tuile { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--panneau-clair); color: var(--texte-doux); }
  .b .cx .tuile { border-radius: 3px; }
  .c .cx .tuile { background: color-mix(in srgb, var(--univers) 18%, var(--panneau)); color: var(--univers); }
  .cx .n { font-weight: 600; } .cx .s { grid-column: 2 / 4; color: var(--texte-doux); font-size: 12px; }

  .bas { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }
  .univers { background: var(--panneau); border: 1px solid var(--bordure); border-radius: 12px; overflow: hidden; }
  .b .univers { border-radius: var(--rayon); }
  .c .univers { border-left: 3px solid var(--univers); }
  .uh { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-weight: 700; border-bottom: 1px solid var(--bordure); background: linear-gradient(90deg, color-mix(in srgb, var(--univers) 22%, transparent), transparent 70%); }
  .b .uh { background: var(--panneau-clair); font-family: var(--police-titre); text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; }
  .uh .ic { display: inline-flex; color: var(--texte); }
  .c .uh .ic { color: var(--univers); }
  .uh .ratio { margin-left: auto; font-family: var(--police-chiffre); color: var(--texte-doux); font-size: 12px; font-weight: 500; }
  .mod { display: grid; grid-template-columns: auto auto 1fr auto; gap: 0 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--bordure); }
  .mod:last-child { border-bottom: 0; }
  .mod .ic { color: var(--texte-doux); display: inline-flex; }
  .c .mod .ic { color: color-mix(in srgb, var(--univers) 70%, var(--texte-doux)); }
  .mod .n { font-weight: 600; } .mod .e { grid-column: 3 / 4; font-size: 12px; color: var(--texte-faible); }
  .mod.av .e { color: var(--avert); } .mod.ko .e { color: var(--erreur); }
  .mod .sw { grid-row: span 2; grid-column: 4; width: 34px; height: 18px; border-radius: 999px; background: var(--bordure-vive); position: relative; }
  .mod .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #cfcfe0; }
  .mod .sw.on { background: var(--succes); } .mod .sw.on::after { left: 19px; background: #fff; }
  .b .mod .sw, .b .mod .sw::after { border-radius: 2px; }
  .mod .point { grid-row: span 2; }
  .mod .ic { grid-row: span 2; }

  .alertes { background: var(--panneau); border: 1px solid var(--bordure); border-radius: 12px; padding: 12px 16px; }
  .b .alertes { border-radius: var(--rayon); }
  .alertes h3 { margin: 0 0 8px; font-size: 14px; display: flex; font-family: var(--police-titre); }
  .b .alertes h3 { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  .alertes h3 span { margin-left: auto; color: var(--erreur); font-family: var(--police-chiffre); }
  .al { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--bordure); }
  .al .ic { grid-row: span 2; color: var(--erreur); display: inline-flex; padding-top: 2px; }
  .al.av .ic { color: var(--avert); }
  .al b { font-size: 13px; } .al span { font-size: 12px; color: var(--texte-doux); }

  /* Page module (actions) */
  .page-mod { display: grid; gap: 14px; }
  .page-mod h1 { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 21px; font-family: var(--police-titre); }
  .b .page-mod h1 { text-transform: uppercase; letter-spacing: .06em; font-size: 17px; }
  .page-mod h1 .ic { color: var(--accent); display: inline-flex; --ic-taille: 24px; }
  .c .page-mod h1 .ic { color: var(--univers); }
  .ligne-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ligne-btn.groupe { border-top: 1px dashed var(--bordure); padding-top: 10px; }
  .ligne-btn .t { color: var(--texte-doux); font-size: 13px; margin-right: 4px; }
  .btn .ic { display: inline-flex; color: var(--accent); }
  .overlay { display: flex; align-items: center; gap: 12px; background: var(--panneau); border: 1px solid var(--bordure); border-radius: 12px; padding: 12px 14px; }
  .b .overlay { border-radius: var(--rayon); }
  .overlay code { color: var(--texte-faible); font-family: var(--police-chiffre, Consolas), Consolas, monospace; font-size: 12px; }
  .overlay .tuile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--panneau-clair); color: var(--texte-doux); }
</style>
</head>
<body>
<div class="planche">
  <div class="intro">
    <h1>StreamKit — icônes et style</h1>
    <p>Le même écran dans quatre habillages : la version actuelle (emojis), puis les pistes A, B et C. Rien n'est codé dans l'application ; seul l'habillage change, la mise en page reste celle de la 1.1.</p>
  </div>
  <div class="onglets" role="tablist">
    <button role="tab" data-piste="actuel">Actuel (emojis)</button>
    <button role="tab" data-piste="a">A · Sobre</button>
    <button role="tab" data-piste="b">B · HUD gaming</button>
    <button role="tab" data-piste="c">C · Mixte</button>
  </div>
  <div class="explication" id="explication"></div>
  <div class="vues">
    <div><div class="legende-vue">Vue d'ensemble</div><div id="vue-accueil"></div></div>
    <div><div class="legende-vue">Page d'un module</div><div id="vue-module"></div></div>
  </div>
</div>

<!-- Icônes : tracés Lucide (licence ISC), 24 × 24, trait de 2. -->

<script>
const PISTES = {
  actuel: {
    titre: 'Actuel — emojis',
    texte: 'Ce qui est livré en 1.1 : des emojis Windows servent d’icônes. Leur dessin, leurs couleurs et leur taille changent d’une version de Windows à l’autre, et ils ne vont pas ensemble (🟣 rond plein à côté de ✂️ détaillé).',
  },
  a: {
    titre: 'A — Sobre',
    texte: '<b>Icônes au trait (Lucide), d’une seule couleur</b>, à la place des emojis. Palette, polices et mise en page inchangées. L’icône prend le violet quand l’entrée est sélectionnée.<ul><li>+ le plus sûr : rien d’autre ne bouge, aspect « outil fini » immédiat</li><li>− les univers se distinguent moins d’un coup d’œil (tout est gris)</li></ul>',
  },
  b: {
    titre: 'B — HUD gaming',
    texte: '<b>Fond bleu nuit, vert pour « tout va bien » et pour le bouton principal</b>, titres en Orbitron capitales, chiffres en JetBrains Mono, coins coupés, sélection marquée d’un trait à gauche. Mêmes icônes au trait que A.<ul><li>+ très « jeu vidéo », se distingue de tout autre outil</li><li>− le violet Twitch disparaît ; le vert sert à la fois à « OK » et au bouton, et les polices devront être embarquées dans l’appli</li></ul>',
  },
  c: {
    titre: 'C — Mixte',
    texte: '<b>A, plus la couleur de chaque univers</b> : Twitch violet, Rocket League bleu, LoL or. Elle colore les icônes du menu, le bord gauche des cartes d’univers et la tuile des connexions. Le violet reste l’accent de l’application.<ul><li>+ on repère son jeu instantanément, sans emoji</li><li>− un peu plus de couleur à l’écran ; chaque nouvel univers doit avoir une couleur lisible sur fond sombre</li></ul>',
  },
};

const U = { twitch: '#9146ff', rl: '#3d8bff', lol: '#c8aa6e' };
// [svg, emoji]
const I = {
  accueil: ['jauge', '📡'], activite: ['historique', '🕒'], metriques: ['graphe', '📊'], connecteurs: ['prise', '🔌'],
  perso: ['pinceau', '🎨'], guide: ['livre', '📖'], bug: ['bug', '🐞'], reglages: ['reglages', '⚙️'],
  twitch: ['antenne', '🟣'], rl: ['fusee', '🚀'], lol: ['epees', '⚔️'], obs: ['camera', '🎥'], spotify: ['musique', '🎵'],
  clips: ['ciseaux', '✂️'], musique: ['musique', '🎵'], predictions: ['cible', '🔮'], pub: ['megaphone', '📺'],
  sondages: ['sondage', '📊'], subgoal: ['cadeau', '🎁'], moments: ['eclair', '⚡'], session: ['drapeau', '🏁'], car: ['voiture', '🎡'],
  alerte: ['alerte', '●'], plus: ['plus', '➕'], moins: ['moins', '➖'], copier: ['copier', ''],
};

let piste = 'c';
const ic = (k) => {
  const [svg, emo] = I[k];
  if (piste === 'actuel') return emo ? `<span class="emo">${emo}</span>` : '';
  return `<svg class="i"><use href="#i-${svg}"/></svg>`;
};
const classeApp = () => 'app ' + (piste === 'actuel' ? '' : piste === 'b' ? 'b' : piste === 'c' ? 'c' : 'a');

function barre() {
  return `<header class="barre">
    <div class="marque">StreamKit<small>1.1.1</small></div>
    <span class="pastille"><span class="point ko"></span>application Twitch non configurée</span>
    <div class="pousse"></div>
    <button class="btn">${ic('guide')} Guide d’utilisation</button>
    <button class="btn">${ic('bug')} Signaler un bug</button>
    <button class="btn discret" aria-label="Réglages">${ic('reglages')}</button>
  </header>`;
}

function rail(sel) {
  const e = (k, nom, point, actif) =>
    `<div class="entree ${actif ? 'actif' : ''}"><span class="point ${point}"></span><span class="ic">${ic(k)}</span>${nom}</div>`;
  const g = (k, nom, compte, point, mods) => `
    <div style="--univers:${U[k]}">
      <div class="groupe-t"><span class="ic">${ic(k)}</span>${nom}<span class="compte"><span class="point ${point}"></span>${compte}</span></div>
      ${mods.map(([mk, mn, mp, ma]) => `<div class="entree sous ${ma ? 'actif' : ''}"><span class="point ${mp}"></span><span class="ic">${ic(mk)}</span>${mn}</div>`).join('')}
    </div>`;
  return `<nav class="rail">
    ${e('accueil', 'Vue d’ensemble', 'ko', sel === 'accueil')}
    ${e('activite', 'Activité récente', '')}
    ${e('metriques', 'Métriques', '')}
    ${e('connecteurs', 'Connecteurs', 'av')}
    ${e('perso', 'Personnalisation', '')}
    <h2>Modules</h2>
    ${g('twitch', 'Twitch', '2/6', 'ko', [['clips', 'Clips', ''], ['musique', 'Bot Musique', 'av'], ['sondages', 'Sondages', 'ko'], ['subgoal', 'Sub Goal', '']])}
    ${g('rl', 'Rocket League', '2/3', 'av', [['moments', 'Moments forts', 'av'], ['session', 'Compteur de session', 'av', sel === 'module'], ['car', 'Random Car', '']])}
    ${g('lol', 'League of Legends', '1/2', 'ok', [])}
  </nav>`;
}

function accueil() {
  const cx = (k, nom, s, univ) => `<div class="cx" style="--univers:${univ}"><span class="tuile">${ic(k)}</span><span class="n">${nom}</span><span class="point ${s[0]}"></span><span class="s">${s[1]}</span></div>`;
  const mod = (k, nom, etat, txt, on) => `<div class="mod ${etat}"><span class="point ${etat === '' ? '' : etat}"></span><span class="ic">${ic(k)}</span><span class="n">${nom}</span><span class="sw ${on ? 'on' : ''}"></span><span class="e">${txt}</span></div>`;
  return `<div class="${classeApp()}">${barre()}<main class="corps">${rail('accueil')}
    <section class="detail">
      <div class="hero">
        <svg class="anneau" width="80" height="80" viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--bordure)" stroke-width="9"/><circle cx="43" cy="43" r="36" fill="none" stroke="var(--erreur)" stroke-width="9" stroke-linecap="${piste === 'b' ? 'butt' : 'round'}" stroke-dasharray="170 226" transform="rotate(-90 43 43)"/><text x="43" y="49" text-anchor="middle">75%</text></svg>
        <div><h1>Pas prêt pour le live</h1><p>2 points à régler : Sondages, Bot Musique. Le détail est dans Alertes.</p></div>
        <div class="stats">
          <div class="stat"><b>5<small style="color:var(--texte-faible);font-size:13px"> / 13</small></b><span>modules actifs</span></div>
          <div class="stat"><b>1<small style="color:var(--texte-faible);font-size:13px"> / 1</small></b><span>connexions OK</span></div>
          <div class="stat alerte"><b>2</b><span>alertes</span></div>
        </div>
      </div>
      <div class="titre-s">Connexions</div>
      <div class="conns">
        ${cx('twitch', 'Twitch', ['', 'application Twitch non configurée'], U.twitch)}
        ${cx('obs', 'OBS', ['ok', '2 sources connectées'], '#8b93a7')}
        ${cx('spotify', 'Spotify', ['', 'non configuré'], '#1db954')}
      </div>
      <div class="titre-s">Modules par univers</div>
      <div class="bas">
        <div class="univers" style="--univers:${U.twitch}">
          <div class="uh"><span class="ic">${ic('twitch')}</span>Twitch<span class="ratio">2/6</span></div>
          ${mod('clips', 'Clips', '', 'Désactivé', false)}
          ${mod('musique', 'Bot Musique', 'av', 'À compléter : Spotify', true)}
          ${mod('sondages', 'Sondages', 'ko', 'droit de lecture des sondages manquant', true)}
          ${mod('subgoal', 'Sub Goal', '', 'Désactivé', false)}
        </div>
        <div class="alertes">
          <h3>Alertes<span>2</span></h3>
          <div class="al"><span class="ic">${ic('alerte')}</span><b>Sondages</b><span>droit de lecture des sondages manquant</span></div>
          <div class="al av"><span class="ic">${ic('alerte')}</span><b>Bot Musique</b><span>À compléter : Spotify</span></div>
        </div>
      </div>
    </section></main></div>`;
}

function module_() {
  return `<div class="${classeApp()}" style="height:520px">${barre()}<main class="corps">${rail('module')}
    <section class="detail" style="--univers:${U.rl}">
      <div class="page-mod">
        <h1><span class="ic">${ic('session')}</span>Compteur de session</h1>
        <div class="titre-s">Overlays OBS</div>
        <div class="overlay"><span class="tuile">${ic('obs')}</span><div style="flex:1"><b>Compteur de session</b><br><code>http://127.0.0.1:47455/overlay/rl-session/session</code></div><button class="btn">${ic('copier')} Copier</button><button class="btn">Aperçu</button></div>
        <div class="titre-s">Actions</div>
        <div class="ligne-btn"><button class="btn">Activer l’API dans Rocket League</button><button class="btn">Réinitialiser la session</button><button class="btn">Redémarrer le module</button></div>
        <div class="ligne-btn groupe"><span class="t">Corriger le score</span>
          <button class="btn"><span class="ic">${ic('plus')}</span>Victoire</button><button class="btn"><span class="ic">${ic('moins')}</span>Victoire</button>
          <button class="btn"><span class="ic">${ic('plus')}</span>Défaite</button><button class="btn"><span class="ic">${ic('moins')}</span>Défaite</button></div>
        <div><button class="btn primaire">Enregistrer</button></div>
      </div>
    </section></main></div>`;
}

function dessiner() {
  document.querySelectorAll('.onglets button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.piste === piste)));
  document.getElementById('explication').innerHTML = PISTES[piste].texte;
  document.getElementById('vue-accueil').innerHTML = accueil();
  document.getElementById('vue-module').innerHTML = module_();
}
document.querySelector('.onglets').addEventListener('click', (e) => {
  const b = e.target.closest('[data-piste]');
  if (b) { piste = b.dataset.piste; dessiner(); }
});
const h = location.hash.slice(1);
if (PISTES[h]) piste = h;
dessiner();
</script>
</body>
</html>
